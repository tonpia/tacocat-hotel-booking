name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and release the package.json version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"; exit 0
          fi
          notes=$(awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "${notes:-Release $tag}"
